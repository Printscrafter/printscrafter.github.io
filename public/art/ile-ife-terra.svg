<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#804a26" />
      <stop offset="35%" stop-color="#b87333" />
      <stop offset="70%" stop-color="#e69a47" />
      <stop offset="100%" stop-color="#5a2f13" />
    </linearGradient>

    <linearGradient id="goldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59b27" />
      <stop offset="40%" stop-color="#fae07a" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6712" />
    </linearGradient>

    <linearGradient id="terracottaClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd5338" />
      <stop offset="100%" stop-color="#6e2515" />
    </linearGradient>

    <filter id="bronzeDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#241005" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Warm Umber Canvas -->
  <rect width="1200" height="1600" fill="#241913" />

  <!-- Organic Terracotta Pigment Wash -->
  <path d="M 0 300 C 350 150, 750 400, 1200 200 L 1200 1600 L 0 1600 Z" fill="#3a251b" opacity="0.8" />
  <path d="M 150 500 C 500 350, 950 650, 1150 450 L 1200 1600 L 100 1600 Z" fill="#542e20" opacity="0.6" />

  <!-- Bold Terracotta Architectural Monolith Arch -->
  <path d="M 300 1450 L 300 700 C 300 450, 900 450, 900 700 L 900 1450 Z" fill="url(#terracottaClay)" filter="url(#bronzeDrop)" />

  <!-- Central Ancestral Bronze Mask Profile Contour -->
  <g filter="url(#bronzeDrop)">
    <!-- Crown / Diadem -->
    <path d="M 460 380 Q 600 310 740 380 L 760 480 Q 600 420 440 480 Z" fill="url(#goldShimmer)" />
    <!-- Diadem Filigree Dots -->
    <circle cx="500" cy="420" r="12" fill="#241913" />
    <circle cx="560" cy="405" r="14" fill="#241913" />
    <circle cx="600" cy="400" r="16" fill="#241913" />
    <circle cx="640" cy="405" r="14" fill="#241913" />
    <circle cx="700" cy="420" r="12" fill="#241913" />

    <!-- Royal Face Silhouette -->
    <path d="M 480 480 Q 600 440 720 480 C 740 650, 710 920, 600 1020 C 490 920, 460 650, 480 480 Z" fill="url(#bronzeGrad)" />

    <!-- Striated Linear Scarification / Royal Lineage Waves -->
    <path d="M 510 560 Q 600 580 690 560" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 505 600 Q 600 625 695 600" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 505 640 Q 600 670 695 640" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 510 680 Q 600 715 690 680" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 515 720 Q 600 760 685 720" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 525 760 Q 600 805 675 760" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />
    <path d="M 540 800 Q 600 850 660 800" stroke="url(#goldShimmer)" stroke-width="5" fill="none" />

    <!-- Sculptural Almond Eyes -->
    <ellipse cx="545" cy="650" rx="35" ry="16" fill="#1b120c" />
    <ellipse cx="655" cy="650" rx="35" ry="16" fill="#1b120c" />
    <circle cx="545" cy="650" r="10" fill="url(#goldShimmer)" />
    <circle cx="655" cy="650" r="10" fill="url(#goldShimmer)" />

    <!-- Strong Nose Ridge & Lips -->
    <path d="M 600 630 L 600 760 L 585 780 L 615 780 Z" fill="#4d2410" />
    <path d="M 565 830 Q 600 820 635 830 Q 600 860 565 830 Z" fill="#38190b" />
  </g>

  <!-- Large Floating Gold Leaf Geometric Disc -->
  <circle cx="600" cy="1150" r="260" fill="url(#goldShimmer)" opacity="0.35" filter="url(#bronzeDrop)" />
  <circle cx="600" cy="1150" r="180" fill="none" stroke="url(#goldShimmer)" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Artisanal Ochre Brush Impasto Stems -->
  <path d="M 220 1480 Q 400 1250 560 1380" stroke="url(#goldShimmer)" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 980 1480 Q 800 1220 640 1360" stroke="url(#bronzeGrad)" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Studio Emblem -->
  <text x="1080" y="1530" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#d4af37" letter-spacing="4" text-anchor="end" opacity="0.75">PRINTSCRAFTER • LEKKI ATELIER</text>
  <text x="1080" y="1555" font-family="'Playfair Display', serif" font-size="13" font-style="italic" fill="#ffffff" text-anchor="end" opacity="0.85">Ile-Ife Terra &amp; Ancestral Bronze</text>
</svg>
