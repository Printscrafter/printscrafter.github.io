<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="belgianLinen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f2eb" />
      <stop offset="100%" stop-color="#e9e4d8" />
    </linearGradient>

    <linearGradient id="charcoalInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Belgian Linen Textured Ground -->
  <rect width="1200" height="1600" fill="url(#belgianLinen)" />

  <!-- Abstract Minimalist Geometric Color Blocking in Background -->
  <!-- Muted Sand Semicircle -->
  <path d="M 180 850 A 420 420 0 0 1 1020 850 Z" fill="#ded7c7" opacity="0.6" />
  
  <!-- Subtle Gold Leaf Disk Accent -->
  <circle cx="860" cy="520" r="140" fill="url(#goldAcc)" opacity="0.85" filter="url(#inkSoft)" />

  <!-- Continuous Single-Line Charcoal Contour (Noble African Profile) -->
  <g stroke="url(#charcoalInk)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#inkSoft)">
    
    <!-- Top Crown Contour -->
    <path d="M 400 320 C 500 240, 680 240, 780 340 C 850 410, 840 540, 780 620" />
    
    <!-- Forehead, Defined African Nose, Full Sculpted Lips, Strong Chin, Neck -->
    <path d="M 420 460 C 430 520, 440 570, 430 610 C 420 640, 380 670, 395 720 C 410 750, 450 760, 440 790 C 430 815, 390 820, 405 850 C 420 870, 460 880, 450 910 C 435 940, 380 970, 420 1020 C 460 1070, 500 1140, 520 1260 L 530 1480" />

    <!-- Serene Eye & Long Curved Lashes -->
    <path d="M 480 670 Q 520 660 560 690" />
    <path d="M 500 700 Q 530 730 560 705" />
    <line x1="525" y1="720" x2="520" y2="740" />
    <line x1="540" y1="720" x2="540" y2="742" />

    <!-- Strong High Cheekbone & Ear Contour -->
    <path d="M 560 750 C 620 800, 660 880, 640 960 C 620 1040, 560 1100, 520 1140" />
    <path d="M 640 850 C 680 870, 690 920, 660 950 C 640 970, 620 960, 610 940" />

    <!-- Statement African Choker Neckpiece (Triple Minimalist Bands) -->
    <path d="M 460 1120 Q 580 1170 700 1110" stroke-width="12" />
    <path d="M 480 1180 Q 590 1230 710 1170" stroke-width="10" stroke="url(#goldAcc)" />
    <path d="M 500 1240 Q 600 1290 720 1230" stroke-width="12" />

    <!-- Shoulders Sweeping to Canvas Margins -->
    <path d="M 520 1260 C 620 1310, 800 1340, 980 1480" stroke-width="8" />
    <path d="M 440 1090 C 340 1150, 220 1260, 120 1480" stroke-width="8" />
  </g>

  <!-- Studio Monogram -->
  <text x="1080" y="1530" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#0a0a0d" letter-spacing="4" text-anchor="end" opacity="0.6">PRINTSCRAFTER • LEKKI ATELIER</text>
  <text x="1080" y="1555" font-family="'Playfair Display', serif" font-size="13" font-style="italic" fill="#0a0a0d" text-anchor="end">Monochrome Royal Profile • Line Art</text>
</svg>
