<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <radialGradient id="haloWarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="1" />
      <stop offset="35%" stop-color="#fd8b00" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#e0533c" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#1e1822" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f0c13" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wallBackdrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17141d" />
      <stop offset="50%" stop-color="#120e17" />
      <stop offset="100%" stop-color="#09070c" />
    </linearGradient>

    <linearGradient id="craterBasalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3846" />
      <stop offset="50%" stop-color="#2a2632" />
      <stop offset="100%" stop-color="#16141c" />
    </linearGradient>

    <linearGradient id="rimRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe194" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>

    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="diskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Luxurious Master Bedroom / Lounge Wall Atmosphere -->
  <rect width="1200" height="1600" fill="url(#wallBackdrop)" />

  <!-- Massive Backlit Halo Radiant Glow (2700K Warm Ambience) -->
  <circle cx="600" cy="740" r="520" fill="url(#haloWarmGlow)" filter="url(#superGlow)" opacity="0.9" />
  <circle cx="600" cy="740" r="420" fill="url(#haloWarmGlow)" filter="url(#superGlow)" opacity="0.95" />

  <!-- Floating Standoff Shadow -->
  <circle cx="600" cy="760" r="320" fill="#000000" filter="url(#diskShadow)" opacity="0.9" />

  <!-- Main Floating Basalt Moon Disk -->
  <circle cx="600" cy="740" r="320" fill="url(#craterBasalt)" />

  <!-- Textured Sculptural Relief & Craters -->
  <!-- Crater 1 -->
  <circle cx="500" cy="620" r="85" fill="#201c27" stroke="#3e3948" stroke-width="4" />
  <circle cx="490" cy="610" r="65" fill="#14121a" />
  <circle cx="480" cy="600" r="20" fill="#0c0a10" />

  <!-- Crater 2 -->
  <circle cx="710" cy="800" r="110" fill="#201c27" stroke="#3e3948" stroke-width="5" />
  <circle cx="700" cy="790" r="80" fill="#14121a" />

  <!-- Crater 3 (Small) -->
  <circle cx="450" cy="840" r="45" fill="#1b1822" stroke="#3e3948" stroke-width="3" />

  <!-- Crescent Light Edge on the Floating Disk (Highlighting Rim) -->
  <path d="M 600 420 A 320 320 0 0 1 880 880 A 314 314 0 0 0 600 420 Z" fill="url(#rimRimLight)" opacity="0.85" />

  <!-- Concentric Ambient Radiance Waves -->
  <circle cx="600" cy="740" r="335" fill="none" stroke="url(#rimRimLight)" stroke-width="4" opacity="0.9" />
  <circle cx="600" cy="740" r="370" fill="none" stroke="url(#rimRimLight)" stroke-width="1.5" stroke-dasharray="8 16" opacity="0.6" />
  <circle cx="600" cy="740" r="430" fill="none" stroke="url(#rimRimLight)" stroke-width="1" stroke-dasharray="4 20" opacity="0.4" />

  <!-- Integrated Touch Dimmer Icon at Bottom of Disk -->
  <circle cx="600" cy="1000" r="20" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.7" />
  <circle cx="600" cy="1000" r="6" fill="#ffb703" opacity="0.8" />
  <text x="600" y="1035" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffb703" letter-spacing="2" text-anchor="middle" opacity="0.7">TOUCH DIMMER</text>

  <!-- Functional Spec Capsule -->
  <rect x="420" y="1460" width="360" height="42" rx="21" fill="#14121a" stroke="#ffb703" stroke-width="1.5" opacity="0.8" />
  <text x="600" y="1487" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffb703" letter-spacing="3" text-anchor="middle">2700K WARM AMBIENT SCONCE</text>

  <!-- Studio Monogram -->
  <text x="1080" y="1530" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#ffffff" letter-spacing="4" text-anchor="end" opacity="0.6">PRINTSCRAFTER • LEKKI ATELIER</text>
  <text x="1080" y="1555" font-family="'Playfair Display', serif" font-size="13" font-style="italic" fill="#ffb703" text-anchor="end">Floating Halo • Ambient Night Sconce Art</text>
</svg>
